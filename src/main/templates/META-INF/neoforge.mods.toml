modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/nekomario28/BuyClaimChunks/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/nekomario28/BuyClaimChunks"
logoFile="buyclaimchunks_continued.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbchunks"
type="optional"
reason="Install exactly one claim backend: FTB Chunks or Open Parties and Claims."
versionRange="[${ftb_chunks_version},2102)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="openpartiesandclaims"
type="optional"
reason="Install exactly one claim backend: FTB Chunks or Open Parties and Claims."
versionRange="[${openpac_min_version},0.30)"
ordering="AFTER"
side="BOTH"
