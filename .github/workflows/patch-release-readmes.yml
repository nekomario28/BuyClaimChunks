name: Patch 1.1.1 README release instructions

on:
  push:
    branches:
      - maintenance/1.1.1-hardening
    paths:
      - .github/workflows/patch-release-readmes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: maintenance/1.1.1-hardening

      - name: Update English and Japanese build instructions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('README.md'): [
                  (
                      'Use Java 21:\n\n```shell\n./gradlew clean test build\n```',
                      'Use Java 21. Run unit tests and build the release JAR:\n\n```shell\n./gradlew clean test build\n```\n\nRun the NeoForge GameTest server:\n\n```shell\n./gradlew runGameTestServer\n```\n\nVerify the packaged JAR contents and metadata:\n\n```shell\nbash scripts/verify-release-jar.sh\n```'
                  ),
                  (
                      'build/libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.0.jar',
                      'build/libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar'
                  ),
                  (
                      "GitHub Actions runs tests, builds the JAR, starts a clean dedicated server, and requires it to reach Minecraft's `Done` startup message.",
                      "GitHub Actions runs unit tests, validates the packaged JAR, executes NeoForge GameTests, starts a clean dedicated server, and requires it to reach Minecraft's `Done` startup message. Tags matching the project version are also validated before a GitHub Release and SHA-256 checksum are published."
                  ),
              ],
              Path('README_ja.md'): [
                  (
                      'Java 21を使用します。\n\n```shell\n./gradlew clean test build\n```',
                      'Java 21を使用します。単体テストとリリースJARのビルドを実行します。\n\n```shell\n./gradlew clean test build\n```\n\nNeoForge GameTestサーバーを実行します。\n\n```shell\n./gradlew runGameTestServer\n```\n\n生成されたJARの内容とメタデータを検証します。\n\n```shell\nbash scripts/verify-release-jar.sh\n```'
                  ),
                  (
                      'build/libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.0.jar',
                      'build/libs/buyclaimchunks-continued-neoforge-1.21.1-1.1.1.jar'
                  ),
                  (
                      'GitHub Actionsではテスト、JARビルド、クリーンな専用サーバー起動を実行し、Minecraftの`Done`メッセージへ到達することを確認します。',
                      'GitHub Actionsでは単体テスト、完成JAR検査、NeoForge GameTest、クリーンな専用サーバー起動を実行し、Minecraftの`Done`メッセージへ到達することを確認します。プロジェクトのバージョンと一致するタグでは、検証後にGitHub ReleaseとSHA-256チェックサムも公開します。'
                  ),
              ],
          }

          for path, changes in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit README updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README_ja.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: document GameTests and release validation'
          git push origin HEAD:maintenance/1.1.1-hardening
