name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Validate and publish both backends
    runs-on: buyclaimchunks
    timeout-minutes: 150
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          expected_tag="v${mod_version}"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "Tag $RELEASE_TAG does not match project version $expected_tag." >&2
            exit 1
          fi

      - name: Validate FTB backend
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew clean test build \
            -Pclaim_backend=ftb \
            --no-daemon --stacktrace 2>&1 | tee release-build-ftb.log
          bash scripts/verify-release-jar.sh ftb > ftb-jar-path.txt
          ./gradlew runGameTestServer \
            -Pclaim_backend=ftb \
            --no-daemon --console=plain 2>&1 | tee release-gametest-ftb.log
          bash scripts/run-ftb-restart-integration.sh
          bash scripts/run-backend-server-smoke.sh ftb

      - name: Preserve FTB release artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dist
          ftb_jar=$(cat ftb-jar-path.txt)
          cp "$ftb_jar" release-dist/

      - name: Validate OpenPAC backend
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew clean test build \
            -Pclaim_backend=openpac \
            --no-daemon --stacktrace 2>&1 | tee release-build-openpac.log
          bash scripts/verify-release-jar.sh openpac > openpac-jar-path.txt
          ./gradlew runGameTestServer \
            -Pclaim_backend=openpac \
            --no-daemon --console=plain 2>&1 | tee release-gametest-openpac.log
          bash scripts/run-openpac-restart-integration.sh
          bash scripts/run-backend-server-smoke.sh openpac

      - name: Prepare release files and notes
        shell: bash
        run: |
          set -euo pipefail
          openpac_jar=$(cat openpac-jar-path.txt)
          cp "$openpac_jar" release-dist/

          for jar_file in release-dist/*.jar; do
            (
              cd release-dist
              sha256sum "$(basename "$jar_file")"
            ) > "${jar_file}.sha256"
          done

          mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)
          awk -v version="$mod_version" '
            $0 ~ "^## " version "( |$)" { capture = 1 }
            capture && $0 ~ /^## / && $0 !~ ("^## " version "( |$)") { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG section found for ${mod_version}." >&2
            exit 1
          fi

          printf 'MOD_VERSION=%s\n' "$mod_version" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-dist/*.jar \
            release-dist/*.sha256 \
            --verify-tag \
            --title "BuyClaimChunks Continued $MOD_VERSION" \
            --notes-file release-notes.md

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            release-dist/
            release-notes.md
            release-build-ftb.log
            release-build-openpac.log
            release-gametest-ftb.log
            release-gametest-openpac.log
            integration-seed.log
            integration-verify.log
            openpac-integration-seed.log
            openpac-integration-verify.log
            server-smoke-ftb.log
            server-smoke-openpac.log
            run-integration-ftb/purchase-state.properties
            run-integration-ftb/logs/latest.log
            run-integration-ftb/**/ftbchunks/**
            run-integration-openpac/purchase-state.properties
            run-integration-openpac/logs/latest.log
            run-integration-openpac/**/openpartiesandclaims/**
          if-no-files-found: warn
          retention-days: 14
