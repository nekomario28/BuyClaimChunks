name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, smoke test, and publish release
    if: github.repository == 'nekomario28/BuyClaimChunks'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify tag matches mod version
        shell: bash
        run: |
          expected_tag="v$(sed -n 's/^mod_version=//p' gradle.properties)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $expected_tag" >&2
            exit 1
          fi

      - name: Run tests and build
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Smoke test dedicated server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          log_file="$RUNNER_TEMP/buyclaimchunks-release-server-smoke.log"
          setsid ./gradlew runServer --no-daemon --console=plain >"$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..120}; do
            if grep -Eq 'Done \([0-9.]+s\)!' "$log_file"; then
              echo 'Dedicated server reached Done.'
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid" || true
              cat "$log_file"
              echo 'Dedicated server exited before reaching Done.' >&2
              exit 1
            fi

            sleep 2
          done

          cat "$log_file"
          echo 'Dedicated server did not reach Done before the smoke-test deadline.' >&2
          exit 1

      - name: Prepare release assets
        shell: bash
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print | sort
          )

          if (( ${#jars[@]} == 0 )); then
            echo 'No release JAR was produced.' >&2
            exit 1
          fi

          printf '%s\n' "${jars[@]}" > release-assets.txt
          sha256sum "${jars[@]}" > build/libs/SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t jars < release-assets.txt
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "${jars[@]}" \
            build/libs/SHA256SUMS \
            --verify-tag \
            --title "BuyClaimChunks Continued $version" \
            --generate-notes
