name: C2f-R encrypted dedicated-server bridge

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - ci/c2fr-encrypted-bridge
    paths:
      - .github/c2fr-encrypted-bridge-trigger.txt

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: c2fr-encrypted-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dedicated-server-evidence:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'ci/c2fr-encrypted-bridge-trigger'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_SHA: ccbb0db23ec33cf8b71687051ab01dcade9b9e7c
      EXPECTED_JAR_SHA256: 78efb131dffb9a042bae3b22d1c8f6b022e8af93c2230503a3fe057ecf98dc0e
      PRIOR_EVIDENCE_SHA256: 96a1ad7d73aa7861ab34d4045d1c568de25a6463415e21410b7bf504bdf793de
      NEOFORGE_VERSION: 21.1.242
      MINECRAFT_VERSION: 1.21.1
      NEOFORGE_INSTALLER_SHA256: f11bef99d86dc424a93117ddf33507e5eaeb78173375741f70d2962e39a66787
      PAYLOAD_BRANCH: ci/c2fr-encrypted-bridge-trigger
      EVIDENCE_DIR: bridge-evidence

    steps:
      - name: Generate one-run encryption key and publish public half
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c2fr-bridge" "$EVIDENCE_DIR"
          chmod 700 "$RUNNER_TEMP/c2fr-bridge"
          openssl genpkey -algorithm RSA \
            -pkeyopt rsa_keygen_bits:3072 \
            -out "$RUNNER_TEMP/c2fr-bridge/private.pem" >/dev/null 2>&1
          openssl pkey -in "$RUNNER_TEMP/c2fr-bridge/private.pem" \
            -pubout -out "$RUNNER_TEMP/c2fr-bridge/public.pem"
          chmod 600 "$RUNNER_TEMP/c2fr-bridge/private.pem"
          PUB_B64="$(base64 -w0 "$RUNNER_TEMP/c2fr-bridge/public.pem")"
          BODY="C2FR_BRIDGE_PUBLIC_KEY_V1 run_id=$GITHUB_RUN_ID public_key_base64=$PUB_B64"
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -f body="$BODY" >/dev/null
          printf 'key_algorithm=RSA-3072-OAEP-SHA256\nrun_id=%s\n' "$GITHUB_RUN_ID" \
            > "$EVIDENCE_DIR/key-exchange.txt"

      - name: Wait for encrypted exact JAR payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_content() {
            local path="$1" output="$2" encoded
            encoded="$(gh api \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$PAYLOAD_BRANCH" \
              --jq '.content' 2>/dev/null || true)"
            [[ -n "$encoded" ]] || return 1
            printf '%s' "$encoded" | tr -d '\n' | base64 -d > "$output"
            [[ -s "$output" ]]
          }

          READY=0
          for _ in $(seq 1 120); do
            if fetch_content bridge/c2fr-payload.enc "$RUNNER_TEMP/c2fr-bridge/payload.enc" && \
               fetch_content bridge/c2fr-key.enc "$RUNNER_TEMP/c2fr-bridge/key.enc"; then
              READY=1
              break
            fi
            rm -f "$RUNNER_TEMP/c2fr-bridge/payload.enc" "$RUNNER_TEMP/c2fr-bridge/key.enc"
            sleep 5
          done
          [[ "$READY" -eq 1 ]]
          printf 'encrypted_payload_received=PASS\n' >> "$EVIDENCE_DIR/key-exchange.txt"

      - name: Decrypt and verify immutable production JAR
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey "$RUNNER_TEMP/c2fr-bridge/private.pem" \
            -in "$RUNNER_TEMP/c2fr-bridge/key.enc" \
            -out "$RUNNER_TEMP/c2fr-bridge/passphrase.bin" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in "$RUNNER_TEMP/c2fr-bridge/payload.enc" \
            -out "$RUNNER_TEMP/c2fr-bridge/production.jar" \
            -pass file:"$RUNNER_TEMP/c2fr-bridge/passphrase.bin"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/c2fr-bridge/production.jar" | awk '{print $1}')"
          [[ "$ACTUAL_SHA" == "$EXPECTED_JAR_SHA256" ]]
          jar tf "$RUNNER_TEMP/c2fr-bridge/production.jar" > "$EVIDENCE_DIR/production-jar-contents.txt"
          grep -Fq 'com/nekomario28/civitasresidents/CivitasResidents.class' \
            "$EVIDENCE_DIR/production-jar-contents.txt"
          grep -Fq 'ResidentsIdentityProviderRegistration.class' \
            "$EVIDENCE_DIR/production-jar-contents.txt"
          grep -Fq 'ResidentsIdentityProviderExtension.class' \
            "$EVIDENCE_DIR/production-jar-contents.txt"
          ! grep -Fq 'C2fRProviderRegistrationTestMain' \
            "$EVIDENCE_DIR/production-jar-contents.txt"
          printf 'production_jar_sha256=%s\nproduction_jar_identity=PASS\n' "$ACTUAL_SHA" \
            > "$EVIDENCE_DIR/production-jar.txt"
          rm -f "$RUNNER_TEMP/c2fr-bridge/passphrase.bin" \
            "$RUNNER_TEMP/c2fr-bridge/private.pem" \
            "$RUNNER_TEMP/c2fr-bridge/key.enc" \
            "$RUNNER_TEMP/c2fr-bridge/payload.enc"

      - name: Install isolated NeoForge server
        shell: bash
        run: |
          set -euo pipefail
          SERVER_DIR="$RUNNER_TEMP/c2fr-server"
          printf 'SERVER_DIR=%s\n' "$SERVER_DIR" >> "$GITHUB_ENV"
          mkdir -p "$SERVER_DIR/mods"
          curl --fail --location --retry 3 --retry-all-errors \
            -o "$SERVER_DIR/neoforge-installer.jar" \
            "https://maven.neoforged.net/releases/net/neoforged/neoforge/$NEOFORGE_VERSION/neoforge-$NEOFORGE_VERSION-installer.jar"
          printf '%s  %s\n' "$NEOFORGE_INSTALLER_SHA256" "$SERVER_DIR/neoforge-installer.jar" \
            | sha256sum --check -
          (cd "$SERVER_DIR" && java -jar neoforge-installer.jar --installServer) \
            > "$EVIDENCE_DIR/installer.log" 2>&1
          cp "$RUNNER_TEMP/c2fr-bridge/production.jar" "$SERVER_DIR/mods/"
          printf 'eula=true\n' > "$SERVER_DIR/eula.txt"
          PORT="$(python3 - <<'PY'
          import socket
          with socket.socket() as sock:
              sock.bind(("127.0.0.1", 0))
              print(sock.getsockname()[1])
          PY
          )"
          printf 'SERVER_PORT=%s\n' "$PORT" >> "$GITHUB_ENV"
          cat > "$SERVER_DIR/server.properties" <<EOF
          difficulty=peaceful
          enable-command-block=false
          enable-query=false
          enable-rcon=false
          enforce-secure-profile=false
          generate-structures=false
          level-name=c2fr-m4-world
          level-type=minecraft:flat
          max-players=1
          motd=C2f-R M4 bridge
          online-mode=false
          server-ip=127.0.0.1
          server-port=$PORT
          simulation-distance=2
          spawn-protection=0
          sync-chunk-writes=true
          view-distance=2
          white-list=false
          EOF
          sed -i 's/^[[:space:]]*//' "$SERVER_DIR/server.properties"
          cp "$SERVER_DIR/server.properties" "$EVIDENCE_DIR/server-properties.txt"

      - name: Start Residents-only dedicated server to completion
        shell: bash
        run: |
          set -euo pipefail
          (
            cd "$SERVER_DIR"
            exec java \
              -Xms512M -Xmx2G \
              -Djava.awt.headless=true \
              -Djava.security.egd=file:/dev/urandom \
              -Dterminal.jline=false \
              -Dterminal.ansi=false \
              @user_jvm_args.txt \
              "@libraries/net/neoforged/neoforge/$NEOFORGE_VERSION/unix_args.txt" nogui \
              </dev/null
          ) > "$EVIDENCE_DIR/residents-only-server.log" 2>&1 &
          PID=$!
          STARTED=0
          ELAPSED=0
          while (( ELAPSED < 600 )); do
            if grep -Eq 'Done \([0-9.]+s\)!|For help, type' \
              "$EVIDENCE_DIR/residents-only-server.log"; then
              STARTED=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 1
            ELAPSED=$((ELAPSED + 1))
          done
          if (( STARTED != 1 )); then
            kill -TERM "$PID" 2>/dev/null || true
            sleep 5
            kill -KILL "$PID" 2>/dev/null || true
            wait "$PID" || true
            exit 1
          fi
          grep -Fq 'Civitas Residents canonical runtime initialized' \
            "$EVIDENCE_DIR/residents-only-server.log"
          grep -Eq 'Done \([0-9.]+s\)!|For help, type' \
            "$EVIDENCE_DIR/residents-only-server.log"
          kill -TERM "$PID" 2>/dev/null || true
          for _ in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill -KILL "$PID" 2>/dev/null || true
          wait "$PID" || true
          printf 'server_startup=PASS\nserver_wait_seconds=%s\nserver_port=%s\nresidents_runtime_initialized=PASS\n' \
            "$ELAPSED" "$SERVER_PORT" > "$EVIDENCE_DIR/server.txt"

      - name: Finalize supplemental evidence
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/c2fr-bridge/production.jar"
          cat > "$EVIDENCE_DIR/manifest.txt" <<EOF
          evidence_type=ENCRYPTED_HOSTED_SUPPLEMENTAL_SERVER_START
          source_repository=nekomario28/civitas-residents
          exact_head=$TARGET_SHA
          production_jar_sha256=$EXPECTED_JAR_SHA256
          prior_local_evidence_sha256=$PRIOR_EVIDENCE_SHA256
          minecraft_version=$MINECRAFT_VERSION
          neoforge_version=$NEOFORGE_VERSION
          github_bridge_repository=$GITHUB_REPOSITORY
          github_run_id=$GITHUB_RUN_ID
          server_startup=PASS
          residents_runtime_initialized=PASS
          plaintext_jar_uploaded=false
          EOF
          sed -i 's/^[[:space:]]*//' "$EVIDENCE_DIR/manifest.txt"
          (
            cd "$EVIDENCE_DIR"
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
              | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Remove plaintext payload on all outcomes
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/c2fr-bridge" "$RUNNER_TEMP/c2fr-server"

      - name: Upload text-only supplemental evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: c2fr-m4-supplemental-${{ env.TARGET_SHA }}
          path: bridge-evidence
          if-no-files-found: error
          retention-days: 7
