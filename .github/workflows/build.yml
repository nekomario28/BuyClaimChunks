name: Build

on:
  push:
    branches:
      - main
      - feature/openpac-backend-parity
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.backend }} backend validation
    runs-on: [self-hosted, linux, x64, buyclaimchunks]
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        backend: [ftb, openpac]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run unit tests and build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test build \
            -Pclaim_backend=${{ matrix.backend }} \
            --no-daemon --stacktrace 2>&1 | tee build-${{ matrix.backend }}.log

      - name: Verify packaged release JAR
        env:
          CLAIM_BACKEND: ${{ matrix.backend }}
        run: bash scripts/verify-release-jar.sh "${{ matrix.backend }}"

      - name: Run NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Pclaim_backend=${{ matrix.backend }} \
            --no-daemon --console=plain 2>&1 | tee gametest-${{ matrix.backend }}.log

      - name: Run FTB purchase and restart integration
        if: matrix.backend == 'ftb'
        run: bash scripts/run-ftb-restart-integration.sh

      - name: Smoke test dedicated server
        shell: bash
        run: |
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          log_file="$RUNNER_TEMP/buyclaimchunks-${{ matrix.backend }}-server-smoke.log"
          setsid ./gradlew runServer \
            -Pclaim_backend=${{ matrix.backend }} \
            --no-daemon --console=plain >"$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..150}; do
            if grep -Eq 'Done \([0-9.]+s\)!' "$log_file"; then
              cp "$log_file" server-smoke-${{ matrix.backend }}.log
              echo 'Dedicated server reached Done.'
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid" || true
              cp "$log_file" server-smoke-${{ matrix.backend }}.log
              cat "$log_file"
              echo 'Dedicated server exited before reaching Done.' >&2
              exit 1
            fi

            sleep 2
          done

          cp "$log_file" server-smoke-${{ matrix.backend }}.log
          cat "$log_file"
          echo 'Dedicated server did not reach Done before the smoke-test deadline.' >&2
          exit 1

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-${{ matrix.backend }}-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build-${{ matrix.backend }}.log
            gametest-${{ matrix.backend }}.log
            integration-seed.log
            integration-verify.log
            run-integration-ftb/purchase-state.properties
            server-smoke-${{ matrix.backend }}.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ matrix.backend }}-${{ github.sha }}
          path: |
            build-${{ matrix.backend }}.log
            gametest-${{ matrix.backend }}.log
            integration-seed.log
            integration-verify.log
            server-smoke-${{ matrix.backend }}.log
            run/logs/latest.log
            run/crash-reports/
            run-integration-ftb/purchase-state.properties
            run-integration-ftb/logs/latest.log
            run-integration-ftb/crash-reports/
            run-integration-ftb/**/ftbchunks/**
          if-no-files-found: warn
          retention-days: 14
