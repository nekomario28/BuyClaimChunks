name: Build

on:
  push:
    branches:
      - main
      - feature/openpac-backend-parity
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Universal JAR validation
    runs-on: buyclaimchunks
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build and unit test universal JAR
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test build \
            -Ptest_backend=none \
            --no-daemon --stacktrace 2>&1 | tee build-universal.log

      - name: Verify universal release JAR
        run: bash scripts/verify-release-jar.sh

      - name: Run FTB Chunks NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Ptest_backend=ftb \
            --no-daemon --console=plain 2>&1 | tee gametest-ftb.log

      - name: Run FTB Chunks purchase and restart integration
        run: bash scripts/run-ftb-restart-integration.sh

      - name: Smoke test FTB Chunks selection
        run: bash scripts/run-backend-server-smoke.sh ftb

      - name: Run OpenPAC NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Ptest_backend=openpac \
            --no-daemon --console=plain 2>&1 | tee gametest-openpac.log

      - name: Run OpenPAC purchase and restart integration
        run: bash scripts/run-openpac-restart-integration.sh

      - name: Smoke test OpenPAC selection
        run: bash scripts/run-backend-server-smoke.sh openpac

      - name: Prove no-backend purchase fails without payment
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Ptest_backend=none \
            --no-daemon --console=plain 2>&1 | tee gametest-none.log

      - name: Verify no-backend fail-closed startup
        run: bash scripts/run-backend-server-smoke.sh none

      - name: Prove dual-backend purchase fails without payment
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Ptest_backend=both \
            --no-daemon --console=plain 2>&1 | tee gametest-both.log

      - name: Verify dual-backend fail-closed startup
        run: bash scripts/run-backend-server-smoke.sh both

      - name: Upload universal release evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-universal-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build-universal.log
            gametest-ftb.log
            gametest-openpac.log
            gametest-none.log
            gametest-both.log
            integration-seed.log
            integration-verify.log
            openpac-integration-seed.log
            openpac-integration-verify.log
            run-integration-ftb/purchase-state.properties
            run-integration-openpac/purchase-state.properties
            server-smoke-ftb.log
            server-smoke-openpac.log
            server-smoke-none.log
            server-smoke-both.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            build-universal.log
            gametest-ftb.log
            gametest-openpac.log
            gametest-none.log
            gametest-both.log
            integration-seed.log
            integration-verify.log
            openpac-integration-seed.log
            openpac-integration-verify.log
            server-smoke-ftb.log
            server-smoke-openpac.log
            server-smoke-none.log
            server-smoke-both.log
            run/logs/latest.log
            run/crash-reports/
            run-integration-ftb/purchase-state.properties
            run-integration-ftb/logs/latest.log
            run-integration-ftb/crash-reports/
            run-integration-ftb/**/ftbchunks/**
            run-integration-openpac/purchase-state.properties
            run-integration-openpac/logs/latest.log
            run-integration-openpac/crash-reports/
            run-integration-openpac/**/openpartiesandclaims/**
          if-no-files-found: warn
          retention-days: 14
