name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, package, GameTest, restart integration, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run unit tests and build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Verify packaged release JAR
        run: bash scripts/verify-release-jar.sh

      - name: Run NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon --console=plain 2>&1 | tee gametest.log

      - name: Run FTB Chunks purchase and restart integration
        run: bash scripts/run-ftb-restart-integration.sh

      - name: Smoke test dedicated server
        shell: bash
        run: |
          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          log_file="$RUNNER_TEMP/buyclaimchunks-server-smoke.log"
          setsid ./gradlew runServer --no-daemon --console=plain >"$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..120}; do
            if grep -Eq 'Done \([0-9.]+s\)!' "$log_file"; then
              cp "$log_file" server-smoke.log
              echo 'Dedicated server reached Done.'
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid" || true
              cp "$log_file" server-smoke.log
              cat "$log_file"
              echo 'Dedicated server exited before reaching Done.' >&2
              exit 1
            fi

            sleep 2
          done

          cp "$log_file" server-smoke.log
          cat "$log_file"
          echo 'Dedicated server did not reach Done before the smoke-test deadline.' >&2
          exit 1

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build.log
            gametest.log
            integration-seed.log
            integration-verify.log
            run-integration/purchase-state.properties
            server-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            build.log
            gametest.log
            integration-seed.log
            integration-verify.log
            server-smoke.log
            run/logs/latest.log
            run/crash-reports/
            run-integration/purchase-state.properties
            run-integration/logs/latest.log
            run-integration/crash-reports/
            run-integration/**/ftbchunks/**
          if-no-files-found: warn
          retention-days: 14
