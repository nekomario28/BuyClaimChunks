name: Build

on:
  push:
    branches:
      - main
      - feature/openpac-backend-parity
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: FTB and OpenPAC backend validation
    runs-on: buyclaimchunks
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Build and unit test FTB backend
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test build \
            -Pclaim_backend=ftb \
            --no-daemon --stacktrace 2>&1 | tee build-ftb.log

      - name: Verify FTB release JAR
        run: bash scripts/verify-release-jar.sh ftb

      - name: Run FTB NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Pclaim_backend=ftb \
            --no-daemon --console=plain 2>&1 | tee gametest-ftb.log

      - name: Run FTB purchase and restart integration
        run: bash scripts/run-ftb-restart-integration.sh

      - name: Smoke test FTB dedicated server
        run: bash scripts/run-backend-server-smoke.sh ftb

      - name: Upload FTB evidence
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-ftb-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build-ftb.log
            gametest-ftb.log
            integration-seed.log
            integration-verify.log
            run-integration-ftb/purchase-state.properties
            server-smoke-ftb.log
          if-no-files-found: error
          retention-days: 14

      - name: Build and unit test OpenPAC backend
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean test build \
            -Pclaim_backend=openpac \
            --no-daemon --stacktrace 2>&1 | tee build-openpac.log

      - name: Verify OpenPAC release JAR
        run: bash scripts/verify-release-jar.sh openpac

      - name: Run OpenPAC NeoForge GameTests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew runGameTestServer \
            -Pclaim_backend=openpac \
            --no-daemon --console=plain 2>&1 | tee gametest-openpac.log

      - name: Run OpenPAC purchase and restart integration
        run: bash scripts/run-openpac-restart-integration.sh

      - name: Smoke test OpenPAC dedicated server
        run: bash scripts/run-backend-server-smoke.sh openpac

      - name: Upload OpenPAC evidence
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-openpac-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            build-openpac.log
            gametest-openpac.log
            openpac-integration-seed.log
            openpac-integration-verify.log
            run-integration-openpac/purchase-state.properties
            server-smoke-openpac.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload combined diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            build-ftb.log
            build-openpac.log
            gametest-ftb.log
            gametest-openpac.log
            integration-seed.log
            integration-verify.log
            openpac-integration-seed.log
            openpac-integration-verify.log
            server-smoke-ftb.log
            server-smoke-openpac.log
            run/logs/latest.log
            run/crash-reports/
            run-integration-ftb/purchase-state.properties
            run-integration-ftb/logs/latest.log
            run-integration-ftb/crash-reports/
            run-integration-ftb/**/ftbchunks/**
            run-integration-openpac/purchase-state.properties
            run-integration-openpac/logs/latest.log
            run-integration-openpac/crash-reports/
            run-integration-openpac/**/openpartiesandclaims/**
          if-no-files-found: warn
          retention-days: 14
