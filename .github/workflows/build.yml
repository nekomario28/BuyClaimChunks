name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build, and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Run tests and build
        run: ./gradlew clean test build --no-daemon --stacktrace

      - name: Smoke test dedicated server
        shell: bash
        run: |
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          log_file="$RUNNER_TEMP/buyclaimchunks-server-smoke.log"
          setsid ./gradlew runServer --no-daemon --console=plain >"$log_file" 2>&1 &
          server_pid=$!

          cleanup() {
            kill -TERM -- "-$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in {1..120}; do
            if grep -Eq 'Done \([0-9.]+s\)!' "$log_file"; then
              cp "$log_file" server-smoke.log
              echo 'Dedicated server reached Done.'
              exit 0
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              wait "$server_pid" || true
              cp "$log_file" server-smoke.log
              cat "$log_file"
              echo 'Dedicated server exited before reaching Done.' >&2
              exit 1
            fi

            sleep 2
          done

          cp "$log_file" server-smoke.log
          cat "$log_file"
          echo 'Dedicated server did not reach Done before the smoke-test deadline.' >&2
          exit 1

      - name: Upload build output
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: buyclaimchunks-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/reports/tests/test/
            server-smoke.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-smoke-${{ github.sha }}
          path: |
            server-smoke.log
            run/logs/latest.log
            run/crash-reports/
          if-no-files-found: warn
          retention-days: 14
