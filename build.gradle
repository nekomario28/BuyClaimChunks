plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

def testBackend = (findProperty('test_backend') ?: 'ftb').toString()
if (!(testBackend in ['ftb', 'openpac', 'none', 'both'])) {
    throw new GradleException("Unsupported test_backend '${testBackend}'. Expected ftb, openpac, none, or both.")
}

group = mod_group_id
version = mod_version

base {
    archivesName = "buyclaimchunks-continued-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        url = 'https://maven.architectury.dev/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

sourceSets {
    main {
        java.srcDir 'src/ftb/java'
        java.srcDir 'src/openpac/java'
    }
}

def integrationGameDirectory = file("run-integration-${testBackend}")
def integrationStateFile = new File(integrationGameDirectory, 'purchase-state.properties')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.expectedBackend', testBackend
        }

        integrationSeed {
            type = 'gameTestServer'
            gameDirectory = integrationGameDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.expectedBackend', testBackend
            systemProperty 'buyclaimchunks.integrationPhase', 'seed'
            systemProperty 'buyclaimchunks.integrationStateFile', integrationStateFile.absolutePath
            disableIdeRun()
        }

        integrationVerify {
            type = 'gameTestServer'
            gameDirectory = integrationGameDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.expectedBackend', testBackend
            systemProperty 'buyclaimchunks.integrationPhase', 'verify'
            systemProperty 'buyclaimchunks.integrationStateFile', integrationStateFile.absolutePath
            disableIdeRun()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Both APIs are compile-time-only. Their full mods are installed separately
    // by users and are never embedded in the BuyClaimChunks Continued JAR.
    compileOnly "dev.architectury:architectury-neoforge:${architectury_version}"
    compileOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
    compileOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
    compileOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    compileOnly "maven.modrinth:gF3BGWvG:${openpac_modrinth_version}"

    // ModDevGradle 2.0.142 does not create a localRuntime configuration in this
    // project. runtimeOnly supplies the selected full mods to development runs
    // without embedding them in the output JAR. This project does not publish a
    // Maven POM, and the packaged-JAR gate rejects copied backend namespaces.
    if (testBackend == 'ftb' || testBackend == 'both') {
        runtimeOnly "dev.architectury:architectury-neoforge:${architectury_version}"
        runtimeOnly "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        runtimeOnly "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        runtimeOnly "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    }
    if (testBackend == 'openpac' || testBackend == 'both') {
        runtimeOnly "maven.modrinth:gF3BGWvG:${openpac_modrinth_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            ftb_chunks_version      : ftb_chunks_version,
            openpac_min_version     : openpac_min_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : 'Buy personal claim capacity with one configurable item economy. Install exactly one supported backend: FTB Chunks or Open Parties and Claims.'
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('NOTICE')
    from('THIRD_PARTY_NOTICES.md')
    manifest {
        attributes('BuyClaimChunks-Backends': 'ftbchunks,openpartiesandclaims')
    }
}

tasks.register('printTestBackend') {
    doLast {
        println testBackend
    }
}
