plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

def claimBackend = (findProperty('claim_backend') ?: 'ftb').toString()
if (!(claimBackend in ['ftb', 'openpac'])) {
    throw new GradleException("Unsupported claim_backend '${claimBackend}'. Expected 'ftb' or 'openpac'.")
}

def backendConfig = [
        ftb: [
                dependencyModId: 'ftbchunks',
                dependencyVersionRange: "[${ftb_chunks_version},2102)",
                displayName: 'FTB Chunks',
                description: 'A maintained fork for buying personal FTB Chunks claim capacity with safe transactions and configurable progressive pricing.'
        ],
        openpac: [
                dependencyModId: 'openpartiesandclaims',
                dependencyVersionRange: "[${openpac_version},0.28)",
                displayName: 'Open Parties and Claims',
                description: 'Buy personal Open Parties and Claims bonus claim capacity with the same safe transactions and configurable progressive pricing as the FTB build.'
        ]
][claimBackend]

group = mod_group_id
version = mod_version

base {
    archivesName = "buyclaimchunks-continued-${claimBackend}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        url = 'https://maven.ftb.dev/releases'
    }
    maven {
        url = 'https://maven.architectury.dev/'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

sourceSets {
    main {
        java.srcDir "src/${claimBackend}/java"
    }
}

if (claimBackend == 'openpac') {
    sourceSets.main.java.exclude 'me/skyadri/buyclaimchunks/BuyClaimChunksRestartIntegrationGameTests.java'
}

def integrationGameDirectory = file("run-integration-${claimBackend}")
def integrationStateFile = new File(integrationGameDirectory, 'purchase-state.properties')

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.backend', claimBackend
        }

        integrationSeed {
            type = 'gameTestServer'
            gameDirectory = integrationGameDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.backend', claimBackend
            systemProperty 'buyclaimchunks.integrationPhase', 'seed'
            systemProperty 'buyclaimchunks.integrationStateFile', integrationStateFile.absolutePath
            disableIdeRun()
        }

        integrationVerify {
            type = 'gameTestServer'
            gameDirectory = integrationGameDirectory
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            systemProperty 'buyclaimchunks.backend', claimBackend
            systemProperty 'buyclaimchunks.integrationPhase', 'verify'
            systemProperty 'buyclaimchunks.integrationStateFile', integrationStateFile.absolutePath
            disableIdeRun()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    if (claimBackend == 'ftb') {
        implementation "dev.architectury:architectury-neoforge:${architectury_version}"
        implementation "dev.ftb.mods:ftb-library-neoforge:${ftb_library_version}"
        implementation "dev.ftb.mods:ftb-teams-neoforge:${ftb_teams_version}"
        implementation "dev.ftb.mods:ftb-chunks-neoforge:${ftb_chunks_version}"
    } else {
        implementation "maven.modrinth:gF3BGWvG:${openpac_modrinth_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.14.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : backendConfig.description,
            claim_backend           : claimBackend,
            claim_backend_name      : backendConfig.displayName,
            claim_dependency_mod_id : backendConfig.dependencyModId,
            claim_dependency_range  : backendConfig.dependencyVersionRange
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from('LICENSE')
    from('NOTICE')
    manifest {
        attributes('BuyClaimChunks-Backend': claimBackend)
    }
}

tasks.register('printClaimBackend') {
    doLast {
        println claimBackend
    }
}
